name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip (if the project was uploaded as a zip)
        run: |
          if ls *.zip >/dev/null 2>&1; then
            for z in *.zip; do unzip -q -o "$z" -d project_unzipped; done
          fi
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          echo "PROJ_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build release APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassMusic-apk
          path: "**/app/build/outputs/apk/release/*.apk"
