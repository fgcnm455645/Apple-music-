name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip (if the project was uploaded as a zip)
        run: |
          if ls *.zip >/dev/null 2>&1; then
            for z in *.zip; do unzip -q -o "$z" -d project_unzipped; done
          fi
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          echo "PROJ_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner already ships with the Android SDK; make sure the newest platform is there.
      - name: Accept licenses and install Android platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37" "build-tools;37.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Build release APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassMusic-apk
          path: "**/app/build/outputs/apk/release/*.apk"
